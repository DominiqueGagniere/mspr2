secret:
  enabled: true
  create: false
  name: cloud-config

tolerations:
  - key: node.cloudprovider.kubernetes.io/uninitialized
    value: "true"
    effect: NoSchedule
  - key: node-role.kubernetes.io/control-plane
    effect: NoSchedule
  - key: node.kubernetes.io/not-ready
    effect: NoSchedule

nodeSelector:
  node-role.kubernetes.io/control-plane: ""

cloudConfig:
  global:
    use-clouds: false
