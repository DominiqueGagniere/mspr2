apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: default

resources:
  - ./resources/postgres-secret.yaml
  - ./resources/postgres-statefulset.yaml
  - ./resources/postgres-service.yaml

helmCharts:
  - name: odoo
    repo: https://imio.github.io/helm-charts
    version: 1.2.0
    releaseName: odoo
    namespace: default
    valuesFile: ../../base/odoo/helm-values/odoo-values.yaml

