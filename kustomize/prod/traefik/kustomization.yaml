apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik

components:
  - ../../base/traefik

helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.0.0
    releaseName: traefik
    namespace: traefik
    valuesFile: ../../base/traefik/helm-values/traefik-values.yaml
    includeCRDs: true
